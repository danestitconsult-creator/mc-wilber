<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171233">
<meta name="robots" content="noindex,nofollow"><title>Manager | MC Wilber</title>
<style>
:root{--bg:#171233;--bg2:#211a47;--ink:#f6f1ff;--mute:#b9b0d9;--hot:#ff4f7b;--gold:#ffc857;--line:#3a3070}
*{box-sizing:border-box;margin:0}body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:20px max(20px,env(safe-area-inset-right)) 20px max(20px,env(safe-area-inset-left))}[hidden]{display:none!important}
button,input,select{font:inherit}
.btn{background:var(--hot);color:#fff;border:0;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
.btn.alt{background:none;border:1px solid var(--gold);color:var(--gold)}.btn.del{background:none;border:1px solid var(--hot);color:var(--hot)}
input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px}
#login{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:20px}
#login div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:36px;max-width:380px}
#login h1{margin-bottom:8px}#login p{color:var(--mute);margin-bottom:20px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#241a00;font-weight:700}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.m{color:var(--mute);font-size:.92rem}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tag{background:var(--gold);color:#241a00;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:700}
.warn{color:var(--hot);font-size:.9rem}#err{color:var(--hot);margin-bottom:12px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sf label{display:grid;gap:4px;margin:12px 0}.sf input:not([type=color]),.sf textarea{width:100%}.sf textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}.sf h3{margin-top:26px;color:var(--gold)}.sf input[type=color]{height:42px;width:90px;padding:2px}
html{-webkit-text-size-adjust:100%}button,a{-webkit-tap-highlight-color:transparent}
input,select,textarea{min-width:0;max-width:100%}
input:not([type=color]):not([type=file]),select,textarea{-webkit-appearance:none;appearance:none}
input[type=date]{min-height:42px;display:block}
select{background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23b9b0d9' stroke-width='2'/></svg>") no-repeat right 10px center;padding-right:30px}
@media(pointer:coarse){.btn,.tabs button{min-height:44px}}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px}
.bars{display:flex;gap:4px;align-items:flex-end;height:150px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}.bars i{display:block;width:100%;background:var(--hot);border-radius:4px 4px 0 0;min-height:2px}.bars span{font-size:.72rem}.bars small{font-size:.68rem;color:var(--mute)}
</style></head><body>
<div id="login"><div><h1>MC Wilber Manager</h1><p>Sign in with the Google account approved for this site.</p>
<button class="btn" id="gi">Sign in with Google</button><div style="margin-top:14px"><button class="btn alt" id="gr">Trouble signing in? Use full-page sign-in</button></div><p id="lm" style="margin:14px 0 0;color:var(--hot)"></p></div></div>

<div id="app" hidden><div class="wrap">
 <div class="bar"><h2>Manager</h2><span class="m"><span id="who"></span> <button class="btn alt" id="so">Sign out</button> <a class="btn alt" href="./">View site</a></span></div>
 <p id="err"></p>
 <div class="tabs" id="tabs"></div><div id="panel"></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeAuth,indexedDBLocalPersistence,browserLocalPersistence,browserSessionPersistence,browserPopupRedirectResolver,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getStorage,ref,uploadBytesResumable,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import {getFirestore,collection,onSnapshot,query,where,doc,updateDoc,deleteDoc,setDoc,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCWFhEOBfrm372DzpATu24gone0KxQ_mEE",authDomain:"mc-wilber.firebaseapp.com",projectId:"mc-wilber",storageBucket:"mc-wilber.firebasestorage.app",messagingSenderId:"1077090036961",appId:"1:1077090036961:web:f37547c21fcf98f8235ba0"});
const auth=initializeAuth(app,{persistence:[indexedDBLocalPersistence,browserLocalPersistence,browserSessionPersistence],popupRedirectResolver:browserPopupRedirectResolver}),db=getFirestore(app),st=getStorage(app),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return dk(d)};
const S={bookings:[],events:[],busyDates:[],subscribers:[],site:[],visits:[]};let tab='bookings',filt='all',unsubs=[];
const NAMES={bookings:'Bookings',site:'Site content',media:'Gallery & Reels',visits:'Visitors',events:'Events',busyDates:'Blocked dates',subscribers:'Subscribers'};

const pv=()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return p};
if(/FBAN|FBAV|Instagram|TikTok|Snapchat|Line\/|; wv\)/i.test(navigator.userAgent))$('#lm').textContent='Google sign-in does not work inside this app. Open this page in Safari or Chrome.';
$('#gi').onclick=async()=>{$('#lm').textContent='';try{await signInWithPopup(auth,pv())}catch(e){
 if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))signInWithRedirect(auth,pv());
 else if(['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))$('#lm').textContent='The sign-in window closed. If this keeps happening, tap the full-page sign-in button below.';
 else $('#lm').textContent='Sign-in failed: '+e.code}};
$('#gr').onclick=()=>signInWithRedirect(auth,pv());
getRedirectResult(auth).catch(e=>{$('#lm').textContent='Sign-in failed: '+e.code});
$('#so').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];
  $('#login').hidden=!!u;$('#app').hidden=!u;if(!u)return;
  $('#who').textContent=u.email;$('#err').textContent='';
  for(const c in S)unsubs.push(onSnapshot(c=='visits'?query(collection(db,c),where('day','>=',ago(29))):collection(db,c),q=>{S[c]=q.docs.map(d=>({id:d.id,...d.data()}));draw()},
    e=>{$('#err').textContent='No access ('+e.code+'). This account is not on the manager list, or the Firestore rules are not published yet.'}));
  draw();
});

const ts=b=>b.createdAt?.seconds||0;
const csv=(rows,name)=>{const k=[...new Set(rows.flatMap(Object.keys))];
  const t=[k,...rows.map(r=>k.map(x=>JSON.stringify(r[x]?.seconds?new Date(r[x].seconds*1000).toISOString():r[x]??'')))].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()};

function draw(){
  $('#tabs').innerHTML=Object.keys(NAMES).map(k=>`<button data-t="${k}" class="${k==tab?'on':''}">${NAMES[k]}${k=='site'||k=='media'?'':' ('+S[k].length+')'}</button>`).join('');
  const p=$('#panel');
  if(tab=='visits'){visitors();return}
  if(tab=='media'){if(!$('#pm'))p.innerHTML='<div id="pm" class="card"></div>';photos();return}
  if(tab=='site'){if(!$('#sf')||!dirty)renderSite();return}
  if(tab=='bookings'){
    const list=S.bookings.filter(b=>filt=='all'||b.status==filt).sort((a,b)=>ts(b)-ts(a));
    p.innerHTML=`<div class="row" style="margin:0 0 14px"><select id="f">${['all','new','contacted','confirmed','declined'].map(o=>`<option ${o==filt?'selected':''}>${o}</option>`).join('')}</select><button class="btn alt" data-a="csv-b">Export CSV</button></div>`+
    (list.map(b=>{const taken=S.busyDates.some(d=>d.id==b.date);
      return `<div class="card"><h3><span>${esc(b.name)} <span class="tag">${esc(b.status)}</span></span><span>${esc(b.date)}</span></h3>
      <p class="m">${esc(b.type)} · ${esc(b.guests||'?')} guests · ${esc(b.venue||'no venue')}<br>${esc(b.email)} ${esc(b.phone)}</p>
      ${b.notes?`<p style="margin-top:8px;white-space:pre-wrap">${esc(b.notes)}</p>`:''}
      ${taken?'<p class="warn">This date is blocked on the site.</p>':''}
      <div class="row"><select data-a="status" data-id="${esc(b.id)}">${['new','contacted','confirmed','declined'].map(o=>`<option ${o==b.status?'selected':''}>${o}</option>`).join('')}</select>
      <button class="btn" data-a="confirm" data-id="${esc(b.id)}">Confirm and block date</button>
      <a class="btn alt" href="mailto:${esc(b.email)}?subject=Your MC Wilber booking for ${esc(b.date)}">Email</a>
      ${b.phone?`<a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/${esc(String(b.phone).replace(/\D/g,''))}">WhatsApp</a>`:''}
      <button class="btn del" data-a="del" data-id="${esc(b.id)}">Delete</button></div></div>`}).join('')||'<p class="m">No bookings here yet.</p>');
  }
  if(tab=='events')p.innerHTML=`<div class="card"><form id="ef" class="row" style="margin:0"><input name="title" placeholder="Event title" required><input name="date" type="date" required><input name="place" placeholder="Place"><button class="btn">Add event</button></form></div>`+
    ([...S.events].sort((a,b)=>a.date>b.date?1:-1).map(e=>`<div class="item"><span><b>${esc(e.title)}</b> <span class="m">${esc(e.date)} · ${esc(e.place)}</span></span><button class="btn del" data-a="del-e" data-id="${esc(e.id)}">Remove</button></div>`).join('')||'<p class="m">No public events.</p>');
  if(tab=='busyDates')p.innerHTML=`<div class="card"><form id="df" class="row" style="margin:0"><input name="date" type="date" required><button class="btn">Block date</button></form><p class="m" style="margin-top:8px">Blocked dates show as taken in the site calendar and booking form.</p></div>`+
    ([...S.busyDates].sort((a,b)=>a.id>b.id?1:-1).map(d=>`<div class="item"><b>${esc(d.id)}</b><button class="btn del" data-a="del-d" data-id="${esc(d.id)}">Unblock</button></div>`).join('')||'<p class="m">No blocked dates.</p>');
  if(tab=='subscribers')p.innerHTML=`<div class="row" style="margin:0 0 14px"><button class="btn alt" data-a="csv-s">Export CSV</button></div>`+
    ([...S.subscribers].sort((a,b)=>ts(b)-ts(a)).map(s=>`<div class="item"><span>${esc(s.email)}</span><button class="btn del" data-a="del-s" data-id="${esc(s.id)}">Remove</button></div>`).join('')||'<p class="m">No subscribers yet.</p>');
}
function visitors(){
 const v=S.visits,days=[...Array(14)].map((_,i)=>ago(13-i)),stat=n=>{const x=v.filter(a=>a.day>=ago(n));return[x.length,new Set(x.map(a=>a.sid)).size]};
 const [t,tu]=stat(0),[w,wu]=stat(6),[m,mu]=stat(29);
 const cnt=k=>Object.entries(v.reduce((o,a)=>{const n=a[k]||'unknown';o[n]=(o[n]||0)+1;return o},{})).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const per=days.map(d=>v.filter(a=>a.day==d).length),mx=Math.max(1,...per);
 const box=(l,a,b)=>`<div class="card"><div class="m">${l}</div><div style="font-size:1.8rem;font-weight:700">${a}</div><div class="m">${b} unique</div></div>`;
 const list=(h,k)=>`<div class="card"><h3>${h}</h3>${cnt(k).map(([n,c])=>`<div class="item"><span>${esc(n)}</span><b>${c}</b></div>`).join('')||'<p class="m">No data yet.</p>'}</div>`;
 $('#panel').innerHTML=`<div class="g">${box('Today',t,tu)}${box('Last 7 days',w,wu)}${box('Last 30 days',m,mu)}</div>
 <div class="card"><h3>Visits, last 14 days</h3><div class="bars">${per.map((c,i)=>`<div title="${days[i]}: ${c}"><span>${c}</span><i style="height:${Math.round(c/mx*100)}px"></i><small>${days[i].slice(8)}</small></div>`).join('')}</div></div>
 <div class="g">${list('Where visitors come from','ref')}${list('Devices','device')}${list('Browsers','browser')}${list('Languages','lang')}</div>
 <div class="card"><h3>Latest visits</h3>${[...v].sort((a,b)=>ts(b)-ts(a)).slice(0,25).map(a=>`<div class="item"><span>${a.createdAt?new Date(a.createdAt.seconds*1000).toLocaleString():'just now'}</span><span class="m">${esc(a.device)} · ${esc(a.browser)} · ${esc(a.ref)}</span></div>`).join('')||'<p class="m">No visits recorded yet.</p>'}</div>
 <p class="m">One visit is counted per browsing session. Unique means different devices. No names or IP addresses are stored.</p>`}
let dirty=false;
const DEF={topText:'Now booking 2026 & 2027 events',heroLine:'The host who keeps your room loud, your timeline tight, and your guests talking about it for years.',badge1:'⭐ 5.0 rated',badge2:'🎉 400+ events',email:'danestitconsult@gmail.com',whatsapp:'233000000000',footerText:'Event host and emcee for weddings, corporate events, concerts and parties.',pressKit:'',
aboutTitle:"Hi, I'm Wilber.",aboutLede:"I've held the mic at weddings, product launches, concerts and street festivals. I read the room, set the pace, and make sure every speech, song and surprise lands on time.",aboutText:'Replace this text with your own story, your years of experience, and what makes your hosting different.',
accent:'#ff4f7b',accent2:'#ffc857',stats:'400+ | events hosted\n3 | languages\n48 hrs | reply time',tags:'English, Twi, Ga, Live crowd work, Own sound gear',
services:'Weddings | Introductions, games, toasts and a flowing reception.\nCorporate events | Launches, galas and award nights, on script and on brand.\nConcerts & festivals | Hype, crowd control and artist handovers.\nBirthdays & parties | Energy, music requests and surprise moments.\nConferences | Panel moderation and clean transitions.\nFunerals & memorials | Calm, respectful and well-paced.',
packages:'Essential | GH₵1,500 | 3 hrs hosting | Planning call; Run-of-show sheet; Basic crowd games\nSignature | GH₵3,000 | 5 hrs hosting | Everything in Essential; Bilingual hosting; Sound system on request\nPremium | GH₵5,500 | Full day | Everything in Signature; Rehearsal visit; Co-host and live DJ liaison',
steps:'Check your date | Pick it in the calendar below.\nSend details | Tell me about the event and your vision.\nConfirm | Get a quote and pay a deposit to hold the date.\nCelebrate | I host, you enjoy the day.',
reviews:'He kept 300 guests on the dance floor all night. | Ama & Kofi, wedding\nProfessional, on time, and the CEO loved him. | Events lead, fintech launch\nBest host we\'ve booked for our festival. | Festival organiser',
faqs:'How far ahead should I book? | As early as you can. Peak months fill 3 to 6 months out.\nDo you bring sound equipment? | Yes, on request. Say so in the form and I\'ll quote it.\nDo you travel? | Yes. Travel and stay are added to the quote.\nHow do I secure my date? | A deposit after you accept the quote. Your date is held once it\'s paid.',
videos:'',socials:'Instagram | https://instagram.com/\nYouTube | https://youtube.com/\nTikTok | https://tiktok.com/\nFacebook | https://facebook.com/\nWhatsApp | https://wa.me/233000000000'};
const shrink=(f,w,q)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(f)});
const media=()=>S.site.find(x=>x.id=='media')||{};
function renderSite(){
 const c={...DEF,...(S.site.find(x=>x.id=='content')||{})};
 const T=(k,l,t='text')=>`<label>${l}<input type="${t}" name="${k}" value="${esc(c[k])}"></label>`;
 const A=(k,l,h,r=5)=>`<label>${l}<span class="m">${h}</span><textarea name="${k}" rows="${r}">${esc(c[k])}</textarea></label>`;
 $('#panel').innerHTML=`<form id="sf" class="sf"><p class="m">Edit anything below, then press Save. Photos have their own upload boxes at the bottom.</p>
 <h3>Banner, headline and contact</h3>${T('topText','Top banner message')}${T('heroLine','Line under the name on the home screen')}${T('badge1','Badge 1')}${T('badge2','Badge 2')}${T('email','Booking email','email')}${T('whatsapp','WhatsApp number (country code, digits only)')}${T('pressKit','Press kit link (optional)')}${T('footerText','Footer description')}
 <h3>About</h3>${T('aboutTitle','Heading')}${A('aboutLede','Intro paragraph','',3)}${A('aboutText','Second paragraph','',3)}${T('tags','Skill tags','text')}<span class="m">Separate tags with commas.</span>
 <h3>Colours</h3><div class="row">${T('accent','Main colour','color')}${T('accent2','Highlight colour','color')}</div>
 <h3>Lists</h3>${A('stats','Numbers on the home screen','One per line: Number | Label',3)}${A('services','Services','One per line: Title | Description',6)}${A('packages','Packages','One per line: Name | Price | Duration | Feature; Feature; Feature',4)}${A('steps','How booking works','One per line: Title | Description',4)}${A('reviews','Reviews','One per line: Quote | Who said it',4)}${A('faqs','Questions','One per line: Question | Answer',5)}${A('socials','Social links','One per line: Name | Link',5)}
 <div class="row"><button class="btn">Save changes</button><span id="sm"></span><button type="button" class="btn del" data-a="reset">Reset text to defaults</button></div></form>`;
 dirty=false;
}
function photos(){const el=$('#pm');if(!el)return;const m=media(),rs=m.reels||[];
 el.innerHTML=`<h3 style="color:var(--gold)">Your photo</h3><p class="m">Shown in the home and About sections.</p>${m.photo?`<img src="${m.photo}" alt="" style="height:120px;border-radius:8px;display:block;margin:8px 0">`:''}<input type="file" accept="image/*" data-a="photo">
 <h3 style="color:var(--gold);margin-top:30px">Gallery photos (up to 10)</h3><p class="m">Pick one or more photos. They upload instantly and appear on the site gallery.</p><div class="row">${(m.gallery||[]).map((g,i)=>`<div><img src="${g}" alt="" style="height:80px;border-radius:6px"><br><button class="btn del" data-a="gdel" data-id="${i}">Remove</button></div>`).join('')||'<span class="m">No photos yet. The site shows placeholder icons until you add some.</span>'}</div><input type="file" accept="image/*" multiple data-a="gallery" style="margin-top:10px">
 <h3 style="color:var(--gold);margin-top:30px">Reels</h3><p class="m">Paste a YouTube link (watch, youtu.be or Shorts), or a direct .mp4 link.</p>
 <form id="rf" class="row"><input name="url" placeholder="https://youtu.be/..." required style="flex:2;min-width:200px"><input name="title" placeholder="Title" style="flex:1;min-width:140px"><button class="btn">Add reel</button></form>
 <p class="m" style="margin-top:12px">Or upload a video file (MP4, up to 100 MB):</p><input type="file" accept="video/*" data-a="reel"> <progress id="rp" max="100" value="0" hidden></progress>
 <div style="margin-top:14px">${rs.map((r,i)=>`<div class="item"><span><b>${esc(r.title)}</b> <span class="m">${r.type=='yt'?'YouTube':'Video file'}</span></span><button class="btn del" data-a="rdel" data-id="${i}">Remove</button></div>`).join('')||'<span class="m">No reels yet.</span>'}</div>`}
document.addEventListener('input',e=>{if(e.target.closest('#sf'))dirty=true});
const addReel=x=>setDoc(doc(db,'site','media'),{reels:[...(media().reels||[]),x]},{merge:true});
const ok=async(f)=>{try{await f()}catch(e){$('#err').textContent='Action failed: '+e.code}};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;draw();return}
  const a=e.target.dataset.a,id=e.target.dataset.id;if(!a)return;
  if(a=='reset'&&confirm('Reset all text to the defaults?'))ok(()=>deleteDoc(doc(db,'site','content')));
  if(a=='rdel')ok(async()=>{const rs=media().reels||[],x=rs[id];if(x?.path)deleteObject(ref(st,x.path)).catch(()=>{});await setDoc(doc(db,'site','media'),{reels:rs.filter((_,i)=>i!=id)},{merge:true})});
  if(a=='gdel')ok(()=>setDoc(doc(db,'site','media'),{gallery:(media().gallery||[]).filter((_,i)=>i!=id)},{merge:true}));
  if(a=='confirm')ok(async()=>{const b=S.bookings.find(x=>x.id==id);await updateDoc(doc(db,'bookings',id),{status:'confirmed'});await setDoc(doc(db,'busyDates',b.date),{booking:id})});
  if(a=='del'&&confirm('Delete this booking?'))ok(()=>deleteDoc(doc(db,'bookings',id)));
  if(a=='del-e')ok(()=>deleteDoc(doc(db,'events',id)));
  if(a=='del-d')ok(()=>deleteDoc(doc(db,'busyDates',id)));
  if(a=='del-s')ok(()=>deleteDoc(doc(db,'subscribers',id)));
  if(a=='csv-b')csv(S.bookings,'bookings.csv');if(a=='csv-s')csv(S.subscribers,'subscribers.csv');
});
document.addEventListener('change',e=>{
  if(e.target.id=='f'){filt=e.target.value;draw()}
  if(e.target.dataset.a=='photo'&&e.target.files[0])ok(async()=>setDoc(doc(db,'site','media'),{photo:await shrink(e.target.files[0],700,.8)},{merge:true}));
  if(e.target.dataset.a=='reel'&&e.target.files[0]){const f=e.target.files[0];
    if(f.size>100*1024*1024){$('#err').textContent='That video is over 100 MB. Compress it or paste a YouTube link.';return}
    const path='reels/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_'),t=uploadBytesResumable(ref(st,path),f),pr=$('#rp');pr.hidden=false;$('#err').textContent='';
    t.on('state_changed',x=>{pr.value=x.bytesTransferred/x.totalBytes*100},
     er=>{pr.hidden=true;$('#err').textContent='Video upload failed ('+er.code+'). Firebase Storage may not be set up yet, or may need the Blaze plan. You can paste a YouTube link instead.'},
     ()=>ok(async()=>{addReel({type:'file',url:await getDownloadURL(t.snapshot.ref),path,title:f.name.replace(/\.[^.]+$/,'')});pr.hidden=true}))}
  if(e.target.dataset.a=='gallery')ok(async()=>{const g=[...(media().gallery||[])];for(const f of e.target.files)if(g.length<10)g.push(await shrink(f,520,.7));await setDoc(doc(db,'site','media'),{gallery:g},{merge:true})});
  if(e.target.dataset.a=='status')ok(()=>updateDoc(doc(db,'bookings',e.target.dataset.id),{status:e.target.value}));
});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id=='rf'){const d=Object.fromEntries(new FormData(e.target)),u=d.url.trim(),y=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/);
    if(y)ok(()=>addReel({type:'yt',id:y[1],title:d.title||'Event reel'}));
    else if(/^https:\/\/.+\.(mp4|webm)(\?.*)?$/i.test(u))ok(()=>addReel({type:'file',url:u,title:d.title||'Event reel'}));
    else $('#err').textContent='Paste a YouTube link or a direct .mp4 link.';
    e.target.reset();return}
  if(e.target.id=='sf'){ok(async()=>{await setDoc(doc(db,'site','content'),Object.fromEntries(new FormData(e.target)));dirty=false;$('#sm').textContent='Saved. Refresh the website to see it.'});return}const d=Object.fromEntries(new FormData(e.target));
  if(e.target.id=='ef')ok(()=>addDoc(collection(db,'events'),d));
  if(e.target.id=='df')ok(()=>setDoc(doc(db,'busyDates',d.date),{manual:true}));
  e.target.reset()});
</script></body></html>
